name = "tsm-scalerics"
# OJO: el proyecto vive en la cuenta *Scalerics*, no en la personal.
# Los proyectos Pages no aceptan `account_id` acá, así que hay que exportar
# la variable antes de correr wrangler (ver README):
#   CLOUDFLARE_ACCOUNT_ID=79da115d272d36fd6ac8a5b08291642e
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# --- D1 (base de datos SQLite) ---
# Crear con:  wrangler d1 create logistica_db
# Luego pegar el database_id que devuelve el comando.
[[d1_databases]]
binding = "DB"
database_name = "logistica_db"
database_id = "768f2a51-6dec-49cd-9f85-718242e17fca"

# --- R2 (almacenamiento de fotos) ---
# Requiere habilitar R2 en el dashboard de Cloudflare y crear el bucket:
#   wrangler r2 bucket create logistica-fotos
# Una vez habilitado, descomentar este bloque y redeployar.
# [[r2_buckets]]
# binding = "FOTOS"
# bucket_name = "logistica-fotos"

# JWT_SECRET y VAPID_PRIVATE se cargan como secrets (ver .env.example / README)
[vars]
NOMINATIM_UA = "scalerics-logistica/0.1 (contacto@ejemplo.com)"
VAPID_SUBJECT = "mailto:contacto@ejemplo.com"
# VAPID_PUBLIC es público (lo usa el frontend); podés dejarlo acá como var.
VAPID_PUBLIC = "BJrx38I6hKnOwHkxVTf0Zp7pJrLoKc_7RlwuzgXVobJvgMzI6mu87sQLo6TnEjZZMcNWZVeOrA4GKGb1mzYG03c"
