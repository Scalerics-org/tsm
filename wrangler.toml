name = "tsm"
main = "api/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# OJO: el proyecto vive en la cuenta *Scalerics*, no en la personal.
# Antes de correr wrangler, exportá:
#   CLOUDFLARE_ACCOUNT_ID=79da115d272d36fd6ac8a5b08291642e
account_id = "79da115d272d36fd6ac8a5b08291642e"

# Dominio propio. Cloudflare crea el registro DNS solo (la zona scalerics.com
# tiene que estar en esta misma cuenta).
routes = [{ pattern = "tsm.scalerics.com", custom_domain = true }]

# --- Frontend (archivos estáticos del build de Vite) ---
# `run_worker_first` manda /api/* al Worker; el resto se sirve como archivo.
# `single-page-application` devuelve index.html en las rutas del front
# (/viaje/3, /panel/viajes...) para que las resuelva React Router.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# --- Observabilidad ---
# Logs del Worker en el panel. No está disponible en Pages; es una de las razones
# por las que el proyecto se movió a Workers.
[observability]
enabled = true

# --- D1 (base de datos SQLite) ---
[[d1_databases]]
binding = "DB"
database_name = "logistica_db"
database_id = "768f2a51-6dec-49cd-9f85-718242e17fca"

# --- R2 (almacenamiento de fotos) ---
# Requiere habilitar R2 en la cuenta de Scalerics y crear el bucket:
#   npx wrangler r2 bucket create logistica-fotos
# Una vez creado, descomentar y volver a desplegar.
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "logistica-fotos"

# El puerto tiene que coincidir con el proxy de vite.config.ts. Sin este bloque wrangler
# levanta en el 8787, el proxy apunta al 8788, y `npm run dev` queda sin API — con pinta de
# bug de la app en vez de un desajuste de configuración.
[dev]
port = 8788

# JWT_SECRET se carga como secret:  npx wrangler secret put JWT_SECRET
[vars]
NOMINATIM_UA = "tsm-scalerics/1.0 (contacto@scalerics.com)"
VAPID_SUBJECT = "mailto:contacto@scalerics.com"
VAPID_PUBLIC = "BFwyzlZmW7CwululHYcCeGU_WHUpUvHhnzFpSMAS9iWFNoDB6Fu7GuHuxojUiMsukJyWcNw-lvS6m1XW8q1mCUc"

# =====================================================================================
# AMBIENTE DE PRUEBA  (prueba.tsm.scalerics.com)
#
# Una copia de producción para que Rodrigo mire cada cambio antes de que llegue a los
# choferes. Se despliega con `npm run deploy:prueba` y NUNCA toca la base ni las fotos de
# producción: tiene su propia D1 y su propio bucket.
#
# En wrangler los bindings y las vars NO se heredan en un env: por eso se repiten enteros.
# JWT_SECRET y VAPID_PRIVATE son secrets propios de este env (`--env prueba`); con los de
# producción, un token de un ambiente entraría en el otro.
# =====================================================================================
[env.prueba]
name = "tsm-prueba"
routes = [{ pattern = "prueba.tsm.scalerics.com", custom_domain = true }]

[env.prueba.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.prueba.observability]
enabled = true

[[env.prueba.d1_databases]]
binding = "DB"
database_name = "logistica_db_prueba"
database_id = "0e2703c4-9711-4eb1-9b63-858908061b79"

[[env.prueba.r2_buckets]]
binding = "FOTOS"
bucket_name = "logistica-fotos-prueba"

[env.prueba.vars]
# Es lo que prende la franja de PRUEBA en la app (la lee /api/health). En producción no existe.
AMBIENTE = "prueba"
NOMINATIM_UA = "tsm-scalerics/1.0 (contacto@scalerics.com)"
VAPID_SUBJECT = "mailto:contacto@scalerics.com"
# Claves propias de prueba: la privada es el secret VAPID_PRIVATE de este env.
VAPID_PUBLIC = "BG63GZTLujBmDingaeWcYVeUc8AZiDsiv5vMHzbD0SsDDKlMBZgPCne9mfmACWKvwn1lPDDONWvJ-tYLf1s5VrA"